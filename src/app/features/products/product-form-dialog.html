<section class="app-dialog app-dialog--product-form" aria-labelledby="product-form-title">
  <header>
    <h2 id="product-form-title">{{ title() }}</h2>
    <p>Los campos marcados con <span aria-hidden="true">*</span> son obligatorios.</p>
  </header>
  @if (submitError()) {
    <app-alert type="alert" [message]="submitError()" />
  }
  <form [formRoot]="form">
    <app-input
      label="Nombre"
      controlId="product-name"
      [formField]="form.name"
      testId="product-name-input"
    />
    <app-input
      label="SKU"
      controlId="product-sku"
      [formField]="form.sku"
      hint="De 3 a 32 caracteres: mayúsculas, números y guiones."
      testId="product-sku-input"
    />
    <app-input
      label="Descripción"
      controlId="product-description"
      [formField]="form.description"
      testId="product-description-input"
    />
    <div class="two-columns">
      <app-number
        label="Precio (€)"
        controlId="product-price"
        [formField]="form.price"
        [step]="0.01"
        testId="product-price-input"
      />
      <app-number
        label="Stock"
        controlId="product-stock"
        [formField]="form.stock"
        [step]="1"
        testId="product-stock-input"
      />
    </div>
    <app-select
      label="Estado"
      controlId="product-status"
      [formField]="form.status"
      [options]="statusOptions"
      testId="product-status-select"
    />
    <div class="app-dialog__actions">
      <button
        type="button"
        class="app-button app-button--secondary"
        (click)="dialogRef.close(false)"
        [disabled]="form().submitting()"
        data-testid="product-form-cancel"
      >
        Cancelar
      </button>
      <button
        type="submit"
        class="app-button app-button--primary"
        [disabled]="form().submitting()"
        data-testid="product-form-submit"
      >
        {{ form().submitting() ? 'Guardando…' : submitLabel() }}
      </button>
    </div>
  </form>
</section>
