<section
  class="app-dialog app-dialog--product-form"
  aria-describedby="product-form-description"
  aria-labelledby="product-form-title"
>
  <header>
    <h2 id="product-form-title">{{ title() }}</h2>
    <p id="product-form-description">
      Los campos marcados con <span aria-hidden="true">*</span> son obligatorios.
    </p>
  </header>

  @if (submitError()) {
    <app-alert type="alert" [message]="submitError()" />
  }

  <form [formRoot]="form">
    <app-field label="Nombre">
      <input
        type="text"
        appControl
        id="product-name"
        [formField]="form.name"
        data-testid="product-name-input"
      />
    </app-field>

    <app-field label="SKU" hint="De 3 a 32 caracteres: mayúsculas, números y guiones.">
      <input
        type="text"
        appControl
        id="product-sku"
        [formField]="form.sku"
        data-testid="product-sku-input"
      />
    </app-field>

    <app-field label="Descripción">
      <input
        appControl
        id="product-description"
        [formField]="form.description"
        data-testid="product-description-input"
      />
    </app-field>

    <div class="two-columns">
      <app-field label="Precio (€)">
        <input
          appControl
          id="product-price"
          type="number"
          [formField]="form.price"
          step="0.01"
          data-testid="product-price-input"
        />
      </app-field>

      <app-field label="Stock">
        <input
          appControl
          id="product-stock"
          type="number"
          [formField]="form.stock"
          step="1"
          data-testid="product-stock-input"
        />
      </app-field>
    </div>

    <app-field label="Estado">
      <select
        appControl
        id="product-status"
        [formField]="form.status"
        data-testid="product-status-select"
      >
        @for (option of statusOptions; track option.value) {
          <option [value]="option.value">{{ option.label }}</option>
        }
      </select>
    </app-field>

    <div class="app-dialog__actions">
      <button
        type="button"
        class="app-button app-button--secondary"
        (click)="dialogRef.close(false)"
        [disabled]="form().submitting()"
        data-testid="product-form-cancel"
      >
        Cancelar
      </button>

      <button
        type="submit"
        class="app-button app-button--primary"
        [disabled]="form().submitting()"
        data-testid="product-form-submit"
      >
        {{ form().submitting() ? 'Guardando…' : submitLabel() }}
      </button>
    </div>
  </form>
</section>
